<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="أنشئ حساباً تجريبياً في منصة ذكاء الطالب.">
  <title>إنشاء حساب | منصة ذكاء الطالب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages.css"><link rel="stylesheet" href="css/auth.css">
  <script defer src="js/auth.js"></script><script defer src="js/layout.js"></script>
</head>
<body><div data-site-header></div><main class="auth-page container">
  <section class="auth-card" aria-labelledby="auth-title"><a class="auth-back" href="index.html">← العودة للرئيسية</a><span class="auth-icon auth-icon--register" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 9.5 12 4l9 5.5M5 10v9m4-9v9m6-9v9m4-9v9M3 20h18M12 12v7m-3.5-3.5h7"></path></svg></span><p class="eyebrow">خطوتك الأولى</p><h1 id="auth-title">إنشاء حساب</h1><p class="auth-subtitle">أنشئ حساباً لتجربة المنصة ومتابعة الخيارات الأكاديمية.</p>
    <form class="auth-form" data-auth-form="register" novalidate>
      <label for="register-name">الاسم الكامل</label><input id="register-name" name="name" type="text" autocomplete="name" minlength="2" placeholder="اكتب اسمك" required>
      <label for="register-email">البريد الإلكتروني</label><input id="register-email" name="email" type="email" autocomplete="email" placeholder="أدخل بريدك الإلكتروني" required>
      <label for="register-password">كلمة المرور</label><input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="٨ أحرف على الأقل" required>
      <label for="register-confirm">تأكيد كلمة المرور</label><input id="register-confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" placeholder="أعد كتابة كلمة المرور" required>
      <p class="form-message" aria-live="polite" hidden></p><button class="button button--primary auth-submit" type="submit">إنشاء حساب</button>
    </form><p class="auth-switch">لديك حساب؟ <a href="login.html">سجل الدخول</a></p><p class="auth-demo-note">هذه واجهة تجريبية؛ لن تُحفظ بياناتك أو تُنشأ حسابات فعلية.</p>
  </section>
</main><div data-site-footer></div></body></html>
