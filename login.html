<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="سجل الدخول إلى منصة ذكاء الطالب.">
  <title>تسجيل الدخول | منصة ذكاء الطالب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages.css"><link rel="stylesheet" href="css/auth.css">
  <script defer src="js/auth.js"></script><script defer src="js/layout.js"></script>
</head>
<body><div data-site-header></div><main class="auth-page container">
  <section class="auth-card" aria-labelledby="auth-title"><a class="auth-back" href="index.html">← العودة للرئيسية</a><span class="auth-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg></span><p class="eyebrow">أهلاً بعودتك</p><h1 id="auth-title">تسجيل الدخول</h1><p class="auth-subtitle">تابع رحلتك الأكاديمية من مكان واحد.</p>
    <form class="auth-form" data-auth-form="login" novalidate>
      <label for="login-email">البريد الإلكتروني</label><input id="login-email" name="email" type="email" autocomplete="email" placeholder="أدخل بريدك الإلكتروني" required>
      <label for="login-password">كلمة المرور</label><input id="login-password" name="password" type="password" autocomplete="current-password" minlength="8" placeholder="أدخل كلمة المرور" required>
      <p class="form-message" aria-live="polite" hidden></p><button class="button button--primary auth-submit" type="submit">تسجيل الدخول</button>
    </form><p class="auth-switch">ما عندك حساب؟ <a href="register.html">أنشئ حساباً جديداً</a></p><p class="auth-demo-note">هذه واجهة تجريبية ولا تُنشئ جلسة دخول فعلية.</p>
  </section>
</main><div data-site-footer></div></body></html>
